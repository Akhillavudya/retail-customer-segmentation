name: 'retail_customer_segmentation'
version: '1.0.0'
config-version: 2

profile: 'retail_customer_segmentation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Path to the enriched CSV, relative to the dbt/ directory (where dbt is run).
vars:
  enriched_csv: "../data/processed/customers_enriched.csv"

models:
  retail_customer_segmentation:
    staging:
      +materialized: view
    marts:
      +materialized: table
